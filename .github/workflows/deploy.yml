name: Deploy Website-SangeetaTalekarBirthday App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on server
        run: |
          cd /srv/apps/Website-SangeetaTalekarBirthday
          git pull origin main

          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"

          export $(grep -v '^#' .env.local | xargs)

          npm install
          npm run build

          pm2 restart Website-SangeetaTalekarBirthday
